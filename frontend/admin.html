<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Store | Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos específicos para o painel admin - Mais fosco, menos transparente */
        .admin-page {
            padding: 40px 0;
            min-height: 70vh;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 12px 25px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .admin-tab.active {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        .admin-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-card {
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.5);
        }

        .admin-card h2,
        .admin-card h3 {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .admin-card h2 i,
        .admin-card h3 i {
            color: #ec4899;
            background: rgba(236, 72, 153, 0.2);
            padding: 10px;
            border-radius: 50%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(25, 25, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(35, 35, 45, 0.9);
            border-color: rgba(236, 72, 153, 0.5);
            box-shadow: 0 15px 30px -8px #ec4899;
        }

        .stat-icon {
            font-size: 2.2rem;
            color: #ec4899;
            margin-bottom: 15px;
            background: rgba(236, 72, 153, 0.15);
            display: inline-block;
            padding: 12px;
            border-radius: 18px;
        }

        .stat-label {
            font-size: 0.95rem;
            opacity: 0.7;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-value small {
            font-size: 1rem;
            opacity: 0.7;
            margin-left: 5px;
        }

        .admin-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .admin-table th {
            background: rgba(99, 102, 241, 0.25);
            color: white;
            font-weight: 600;
            padding: 15px 12px;
            border-radius: 15px 15px 0 0;
            text-align: left;
        }

        .admin-table td {
            background: rgba(30, 30, 40, 0.6);
            backdrop-filter: blur(4px);
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .admin-table tr:hover td {
            background: rgba(50, 50, 60, 0.8);
        }

        .admin-table td:first-child {
            border-radius: 12px 0 0 12px;
        }

        .admin-table td:last-child {
            border-radius: 0 12px 12px 0;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #ec4899;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 8px 12px;
            border-radius: 40px;
        }

        .btn-icon:hover {
            background: rgba(236, 72, 153, 0.2);
            transform: scale(1.1);
        }

        .user-actions {
            position: relative;
            display: inline-block;
        }

        .actions-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            min-width: 200px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .actions-menu.show {
            display: block;
        }

        .actions-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .actions-menu a:last-child {
            border-bottom: none;
        }

        .actions-menu a:hover {
            background: rgba(236, 72, 153, 0.2);
        }

        .actions-menu i {
            width: 20px;
            color: #ec4899;
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-withdraw:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px #ec4899;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(30, 30, 40, 0.7);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ec4899;
            outline: none;
            background: rgba(40, 40, 50, 0.9);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        .feedback-success {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid #48bb78;
            color: #fff;
            padding: 12px;
            border-radius: 40px;
            margin-top: 15px;
            text-align: center;
        }

        .feedback-error {
            background: rgba(245, 101, 101, 0.2);
            border: 1px solid #f56565;
            color: #fff;
            padding: 12px;
            border-radius: 40px;
            margin-top: 15px;
            text-align: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .pagination button {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .pagination button:hover {
            background: rgba(236, 72, 153, 0.3);
        }

        .pagination button.active {
            background: #ec4899;
            border-color: #ec4899;
        }
    </style>
</head>

<body>
    <!-- Header e sidebar (igual antes) -->
    <!-- ... -->

    <main class="admin-page">
        <div class="container">
            <div class="admin-card">
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="dashboard"><i class="fas fa-chart-pie"></i>
                        Dashboard</button>
                    <button class="admin-tab" data-tab="users"><i class="fas fa-users"></i> Usuários</button>
                    <button class="admin-tab" data-tab="ranking"><i class="fas fa-trophy"></i> Ranking</button>
                    <button class="admin-tab" data-tab="withdraw"><i class="fas fa-money-bill-wave"></i> Saque</button>
                    <button class="admin-tab" data-tab="products"><i class="fas fa-box"></i> Produtos</button>
                </div>

                <!-- Dashboard -->
                <div class="admin-section active" id="dashboard">
                    <h2><i class="fas fa-chart-line"></i> Dashboard</h2>
                    <div class="stats-grid" id="statsContainer">
                        <!-- Cards dinâmicos -->
                    </div>
                </div>

                <!-- Usuários -->
                <div class="admin-section" id="users">
                    <h2><i class="fas fa-users-cog"></i> Gerenciar Usuários</h2>
                    <div id="usersContainer"></div>
                    <div id="userPagination" class="pagination"></div>
                </div>

                <!-- Ranking -->
                <div class="admin-section" id="ranking">
                    <h2><i class="fas fa-crown"></i> Ranking de Adições</h2>
                    <div id="rankingContainer"></div>
                </div>

                <!-- Saque -->
                <div class="admin-section" id="withdraw">
                    <h2><i class="fas fa-hand-holding-usd"></i> Saque Rápido</h2>
                    <div style="max-width: 500px;">
                        <div class="form-group">
                            <label><i class="fas fa-dollar-sign"></i> Valor (R$)</label>
                            <input type="number" id="withdrawAmount" min="5" step="0.01" placeholder="Ex: 50.00">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-key"></i> Tipo de Chave PIX</label>
                            <select id="pixKeyType">
                                <option value="CPF">CPF</option>
                                <option value="EMAIL">Email</option>
                                <option value="TELEFONE">Telefone</option>
                                <option value="CHAVE_ALEATORIA">Chave Aleatória</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-paste"></i> Chave PIX</label>
                            <input type="text" id="pixKey" placeholder="Digite a chave PIX">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-pen"></i> Descrição (opcional)</label>
                            <input type="text" id="withdrawDescription" placeholder="Ex: Saque admin">
                        </div>
                        <button class="btn-withdraw" id="btnWithdraw"><i class="fas fa-bolt"></i> Realizar
                            Saque</button>
                        <div id="withdrawFeedback" style="margin-top: 20px;"></div>
                    </div>
                </div>

                <!-- Produtos -->
                <div class="admin-section" id="products">
                    <h2><i class="fas fa-boxes"></i> Gerenciar Produtos</h2>
                    <p style="text-align: center; opacity: 0.7; padding: 40px;">Em desenvolvimento...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer e scripts (mantenha como está) -->
</body>

</html>
